<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart To Do List</title>
  <style>
    :root {
      --bg1: #f8fafc;
      --bg2: #eef2ff;
      --card: rgba(255, 255, 255, 0.92);
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary2: #7c3aed;
      --danger: #ef4444;
      --success: #059669;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.10);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(79, 70, 229, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(124, 58, 237, 0.10), transparent 24%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 860px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      padding: 30px 28px 22px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -40px -40px auto;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      filter: blur(2px);
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 0;
      color: rgba(255,255,255,0.9);
      font-size: 15px;
      line-height: 1.6;
    }

    .content {
      padding: 24px 28px 30px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 18px;
    }

    .input-wrap {
      position: relative;
    }

    #taskInput {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
      background: #fff;
    }

    #taskInput:focus {
      border-color: rgba(79, 70, 229, 0.7);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    #addBtn {
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      min-width: 120px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    #addBtn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .stat .value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .list-area {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      transition: background 0.15s ease;
    }

    li:last-child { border-bottom: none; }

    li:hover {
      background: #fafafa;
    }

    .check {
      width: 22px;
      height: 22px;
      accent-color: var(--success);
      cursor: pointer;
    }

    .task-text {
      font-size: 16px;
      line-height: 1.5;
      word-break: break-word;
      cursor: pointer;
    }

    .done .task-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .doneBtn {
      color: var(--success);
      border-color: rgba(5, 150, 105, 0.22);
      background: rgba(5, 150, 105, 0.06);
    }

    .deleteBtn {
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.22);
      background: rgba(239, 68, 68, 0.06);
    }

    .empty {
      padding: 34px 16px;
      text-align: center;
      color: var(--muted);
      background: #fff;
    }

    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
      font-size: 18px;
    }

    .footer-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .hero, .content { padding-left: 16px; padding-right: 16px; }
      .topbar { grid-template-columns: 1fr; }
      #addBtn { height: 48px; }
      .stats { grid-template-columns: 1fr; }
      li { grid-template-columns: auto 1fr; }
      .actions { grid-column: 1 / -1; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>To Do List</h1>
      <p>오늘 할 일을 빠르게 기록하고, 완료 상태를 한눈에 확인할 수 있는 심플한 작업 관리 화면입니다.</p>
    </section>

    <section class="content">
      <div class="topbar">
        <div class="input-wrap">
          <input id="taskInput" type="text" placeholder="예: 수학 숙제하기" />
        </div>
        <button id="addBtn">추가하기</button>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="label">전체</div>
          <div class="value" id="totalCount">0</div>
        </div>
        <div class="stat">
          <div class="label">완료</div>
          <div class="value" id="doneCount">0</div>
        </div>
        <div class="stat">
          <div class="label">남은 할 일</div>
          <div class="value" id="leftCount">0</div>
        </div>
      </div>

      <div class="list-area">
        <ul id="taskList"></ul>
        <div id="emptyState" class="empty">
          <strong>할 일이 비어 있어요</strong>
          입력창에 내용을 적고 추가하기 버튼을 눌러 시작하세요.
        </div>
      </div>

      <div class="footer-note">
        사용 방법: 할 일을 입력한 뒤 Enter 또는 추가하기 버튼을 누르세요. 항목의 체크박스나 완료 버튼으로 상태를 바꿀 수 있고, 삭제 버튼으로 제거할 수 있습니다.
      </div>
    </section>
  </main>

  <script>
    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const emptyState = document.getElementById("emptyState");
    const totalCount = document.getElementById("totalCount");
    const doneCount = document.getElementById("doneCount");
    const leftCount = document.getElementById("leftCount");

    let tasks = [];

    function updateStats() {
      const total = tasks.length;
      const done = tasks.filter(task => task.done).length;
      totalCount.textContent = total;
      doneCount.textContent = done;
      leftCount.textContent = total - done;
      emptyState.style.display = total === 0 ? "block" : "none";
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    function renderTasks() {
      taskList.innerHTML = "";

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "check";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => toggleTask(index));

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;
        text.addEventListener("click", () => toggleTask(index));

        const actions = document.createElement("div");
        actions.className = "actions";

        const doneBtn = document.createElement("button");
        doneBtn.className = "btn doneBtn";
        doneBtn.textContent = task.done ? "완료 취소" : "완료";
        doneBtn.addEventListener("click", () => toggleTask(index));

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn deleteBtn";
        deleteBtn.textContent = "삭제";
        deleteBtn.addEventListener("click", () => deleteTask(index));

        actions.appendChild(doneBtn);
        actions.appendChild(deleteBtn);

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(actions);

        taskList.appendChild(li);
      });

      updateStats();
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.unshift({ text, done: false });
      taskInput.value = "";
      taskInput.focus();
      renderTasks();
    }

    addBtn.addEventListener("click", addTask);

    taskInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });

    renderTasks();
  </script>
</body>
</html>
