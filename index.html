<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>심해 산호초 탐험 시뮬레이터</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #061a31;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }
    canvas { display: block; }

    #intro {
      position: fixed;
      z-index: 10;
      left: 50%;
      top: 50%;
      width: min(460px, calc(100vw - 36px));
      transform: translate(-50%, -50%);
      padding: 30px;
      text-align: center;
      color: #effdff;
      background: rgba(3, 19, 40, 0.9);
      border: 1px solid rgba(116, 229, 255, 0.42);
      border-radius: 20px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
      transition: opacity .25s ease;
    }
    #intro.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #intro h1 {
      margin: 0 0 12px;
      color: #7eeeff;
      font-size: 25px;
    }
    #intro p {
      margin: 8px 0;
      color: #d4f3fc;
      line-height: 1.65;
      font-size: 15px;
    }
    #startButton {
      margin-top: 16px;
      padding: 12px 24px;
      border: 0;
      border-radius: 9px;
      color: #062139;
      background: #6de8f6;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    #hud {
      position: fixed;
      z-index: 4;
      top: 16px;
      left: 16px;
      padding: 12px 15px;
      color: #dffaff;
      background: rgba(3, 21, 43, 0.7);
      border-left: 3px solid #65eaf8;
      border-radius: 0 10px 10px 0;
      line-height: 1.65;
      font-size: 13px;
      pointer-events: none;
    }
    #depth {
      color: #79f5c8;
      font-weight: bold;
    }
    #crosshair {
      position: fixed;
      z-index: 3;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(218, 255, 255, 0.9);
      box-shadow: 0 0 5px #3eefff;
    }
    #crosshair::before { width: 14px; height: 1px; top: 6px; }
    #crosshair::after { width: 1px; height: 14px; left: 6px; }
    body.playing #crosshair { opacity: 1; }

    #legend {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 4;
      padding: 9px 13px;
      color: #d9f7ff;
      background: rgba(3, 21, 43, 0.62);
      border-radius: 9px;
      font-size: 12px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <section id="intro">
    <h1>🌊 심해 산호초 탐험</h1>
    <p>빛이 스며드는 해저 산호초 사이를 탐험해 보세요.</p>
    <p><b>마우스</b>: 시점 이동<br><b>W A S D</b>: 잠수정 이동</p>
    <button id="startButton">탐험 시작</button>
  </section>

  <div id="hud">
    <strong>DEEP SEA EXPLORER</strong><br>
    이동: W A S D &nbsp;|&nbsp; 시점: 마우스<br>
    수심: <span id="depth">24.0 m</span>
  </div>
  <div id="legend">🐠 산호초 생태 관찰 구역</div>
  <div id="crosshair"></div>

  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x062c52);
    scene.fog = new THREE.FogExp2(0x063359, 0.021);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 220);
    camera.position.set(0, 4.4, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(0x3fc8ff, 0x052010, 2.2);
    scene.add(ambient);

    const sunlight = new THREE.DirectionalLight(0x9eefff, 3.5);
    sunlight.position.set(-18, 30, 12);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.set(2048, 2048);
    sunlight.shadow.camera.left = -40;
    sunlight.shadow.camera.right = 40;
    sunlight.shadow.camera.top = 40;
    sunlight.shadow.camera.bottom = -40;
    scene.add(sunlight);

    const oceanFloorMaterial = new THREE.MeshStandardMaterial({
      color: 0x9a8059,
      roughness: 1,
      metalness: 0
    });

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(190, 190, 50, 50),
      oceanFloorMaterial
    );
    floor.rotation.x = -Math.PI / 2;

    const floorPosition = floor.geometry.attributes.position;
    for (let i = 0; i < floorPosition.count; i++) {
      const x = floorPosition.getX(i);
      const y = floorPosition.getY(i);
      const height = Math.sin(x * 0.22) * 0.22 + Math.cos(y * 0.18) * 0.18 + (Math.random() - 0.5) * 0.12;
      floorPosition.setZ(i, height);
    }
    floor.geometry.computeVertexNormals();
    floor.receiveShadow = true;
    scene.add(floor);

    const rockMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x53595e, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x705e4b, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x44585b, roughness: 1 })
    ];

    function createRock(x, z, scale) {
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1, 1),
        rockMaterials[Math.floor(Math.random() * rockMaterials.length)]
      );
      rock.position.set(x, 0.4 * scale, z);
      rock.scale.set(scale * (0.8 + Math.random() * 0.5), scale * 0.7, scale);
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      rock.castShadow = true;
      rock.receiveShadow = true;
      scene.add(rock);
    }

    for (let i = 0; i < 80; i++) {
      const x = (Math.random() - 0.5) * 90;
      const z = (Math.random() - 0.5) * 110;
      if (Math.abs(x) < 8 && Math.abs(z) < 14) continue;
      createRock(x, z, 0.25 + Math.random() * 1.25);
    }

    const coralMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xff6a8c, roughness: 0.75 }),
      new THREE.MeshStandardMaterial({ color: 0xffa64d, roughness: 0.75 }),
      new THREE.MeshStandardMaterial({ color: 0xae75f3, roughness: 0.75 }),
      new THREE.MeshStandardMaterial({ color: 0xef3f70, roughness: 0.75 }),
      new THREE.MeshStandardMaterial({ color: 0x55d6bb, roughness: 0.75 })
    ];

    function createCoral(x, z, scale = 1) {
      const group = new THREE.Group();
      const material = coralMaterials[Math.floor(Math.random() * coralMaterials.length)];
      const branches = 4 + Math.floor(Math.random() * 4);

      for (let i = 0; i < branches; i++) {
        const height = (1.0 + Math.random() * 1.8) * scale;
        const branch = new THREE.Mesh(
          new THREE.CylinderGeometry(0.09 * scale, 0.18 * scale, height, 8),
          material
        );
        const angle = (i / branches) * Math.PI * 2 + Math.random() * 0.45;
        const distance = Math.random() * 0.4 * scale;
        branch.position.set(Math.cos(angle) * distance, height / 2, Math.sin(angle) * distance);
        branch.rotation.z = Math.cos(angle) * (0.12 + Math.random() * 0.22);
        branch.rotation.x = Math.sin(angle) * (0.12 + Math.random() * 0.22);
        branch.castShadow = true;
        group.add(branch);

        const tip = new THREE.Mesh(
          new THREE.SphereGeometry(0.17 * scale, 10, 8),
          material
        );
        tip.position.copy(branch.position);
        tip.position.y += height / 2 - 0.05;
        tip.castShadow = true;
        group.add(tip);
      }

      group.position.set(x, 0.12, z);
      scene.add(group);
    }

    function createSeaweed(x, z, height) {
      const group = new THREE.Group();
      const material = new THREE.MeshStandardMaterial({
        color: Math.random() > 0.5 ? 0x247f56 : 0x4caa62,
        roughness: 0.9,
        side: THREE.DoubleSide
      });

      for (let i = 0; i < 4; i++) {
        const blade = new THREE.Mesh(
          new THREE.PlaneGeometry(0.24, height * (0.7 + Math.random() * 0.4), 1, 6),
          material
        );
        blade.position.set((Math.random() - 0.5) * 0.45, blade.geometry.parameters.height / 2, (Math.random() - 0.5) * 0.45);
        blade.rotation.y = Math.random() * Math.PI;
        blade.userData.phase = Math.random() * Math.PI * 2;
        group.add(blade);
      }
      group.position.set(x, 0.12, z);
      group.userData.seaweed = true;
      scene.add(group);
      return group;
    }

    const seaweedGroups = [];
    for (let i = 0; i < 55; i++) {
      const x = (Math.random() - 0.5) * 76;
      const z = (Math.random() - 0.5) * 92;
      seaweedGroups.push(createSeaweed(x, z, 1 + Math.random() * 2.8));
    }

    [
      [-8, 3, 1.5], [7, -4, 1.7], [-16, -16, 1.3], [14, 15, 1.6],
      [-22, 9, 1.2], [23, -10, 1.5], [4, -24, 1.3], [-5, 24, 1.4],
      [28, 26, 1.5], [-29, -28, 1.7], [20, -34, 1.4], [-22, 35, 1.4]
    ].forEach(([x, z, s]) => createCoral(x, z, s));

    const fishMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xffd23f, roughness: 0.55 }),
      new THREE.MeshStandardMaterial({ color: 0x49d8ff, roughness: 0.55 }),
      new THREE.MeshStandardMaterial({ color: 0xff719b, roughness: 0.55 }),
      new THREE.MeshStandardMaterial({ color: 0x9ef06b, roughness: 0.55 })
    ];

    const fishSchools = [];

    function createFishSchool(centerX, centerY, centerZ, count) {
      const school = new THREE.Group();

      for (let i = 0; i < count; i++) {
        const fish = new THREE.Group();
        const mat = fishMaterials[Math.floor(Math.random() * fishMaterials.length)];

        const body = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 8), mat);
        body.scale.set(1.6, 0.75, 0.72);
        fish.add(body);

        const tail = new THREE.Mesh(
          new THREE.ConeGeometry(0.25, 0.48, 4),
          mat
        );
        tail.rotation.z = -Math.PI / 2;
        tail.position.x = -0.55;
        fish.add(tail);

        fish.position.set(
          (Math.random() - 0.5) * 8,
          (Math.random() - 0.5) * 3,
          (Math.random() - 0.5) * 6
        );
        fish.userData.offset = Math.random() * Math.PI * 2;
        fish.userData.speed = 0.35 + Math.random() * 0.4;
        school.add(fish);
      }

      school.position.set(centerX, centerY, centerZ);
      school.userData.radius = 3 + Math.random() * 3;
      school.userData.speed = 0.16 + Math.random() * 0.12;
      school.userData.offset = Math.random() * Math.PI * 2;
      scene.add(school);
      fishSchools.push(school);
    }

    createFishSchool(-8, 5.5, -6, 17);
    createFishSchool(14, 7, -22, 14);
    createFishSchool(-18, 6, 17, 12);
    createFishSchool(8, 4, 29, 16);

    const treasure = new THREE.Group();
    const chestBase = new THREE.Mesh(
      new THREE.BoxGeometry(2.1, 1, 1.25),
      new THREE.MeshStandardMaterial({ color: 0x70401b, roughness: 0.75 })
    );
    chestBase.position.y = 0.6;
    chestBase.castShadow = true;
    treasure.add(chestBase);

    const chestTop = new THREE.Mesh(
      new THREE.CylinderGeometry(1.05, 1.05, 1.25, 16, 1, false, 0, Math.PI),
      new THREE.MeshStandardMaterial({ color: 0x8e5725, roughness: 0.7 })
    );
    chestTop.rotation.z = Math.PI / 2;
    chestTop.position.set(0, 1.08, 0);
    chestTop.castShadow = true;
    treasure.add(chestTop);

    const gold = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, 1.3, 1.3),
      new THREE.MeshStandardMaterial({ color: 0xffcf3d, metalness: 0.7, roughness: 0.3 })
    );
    gold.position.set(0, 0.85, 0.02);
    treasure.add(gold);

    treasure.position.set(-4, 0.15, -14);
    treasure.rotation.y = 0.35;
    scene.add(treasure);

    const bubbles = [];
    const bubbleMaterial = new THREE.MeshBasicMaterial({
      color: 0xa7efff,
      transparent: true,
      opacity: 0.35
    });

    for (let i = 0; i < 170; i++) {
      const bubble = new THREE.Mesh(
        new THREE.SphereGeometry(0.025 + Math.random() * 0.07, 8, 8),
        bubbleMaterial
      );
      bubble.position.set(
        (Math.random() - 0.5) * 70,
        Math.random() * 18,
        (Math.random() - 0.5) * 90
      );
      bubble.userData.speed = 0.3 + Math.random() * 0.7;
      bubble.userData.drift = Math.random() * Math.PI * 2;
      scene.add(bubble);
      bubbles.push(bubble);
    }

    const intro = document.getElementById("intro");
    const startButton = document.getElementById("startButton");
    const depthLabel = document.getElementById("depth");

    let locked = false;
    let yaw = 0;
    let pitch = -0.08;
    const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };

    function startExploration() {
      renderer.domElement.requestPointerLock();
    }

    startButton.addEventListener("click", startExploration);
    intro.addEventListener("click", event => {
      if (event.target !== startButton) startExploration();
    });

    document.addEventListener("pointerlockchange", () => {
      locked = document.pointerLockElement === renderer.domElement;
      intro.classList.toggle("hidden", locked);
      document.body.classList.toggle("playing", locked);
    });

    document.addEventListener("mousemove", event => {
      if (!locked) return;
      yaw -= event.movementX * 0.0024;
      pitch -= event.movementY * 0.0022;
      pitch = THREE.MathUtils.clamp(pitch, -0.85, 0.65);
      camera.rotation.set(pitch, yaw, 0, "YXZ");
    });

    addEventListener("keydown", event => {
      if (event.code in keys) {
        keys[event.code] = true;
        event.preventDefault();
      }
    });

    addEventListener("keyup", event => {
      if (event.code in keys) keys[event.code] = false;
    });

    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const delta = Math.min((now - lastTime) / 1000, 0.05);
      const time = now * 0.001;
      lastTime = now;

      if (locked) {
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        const movement = new THREE.Vector3();

        if (keys.KeyW) movement.add(forward);
        if (keys.KeyS) movement.sub(forward);
        if (keys.KeyD) movement.add(right);
        if (keys.KeyA) movement.sub(right);

        if (movement.lengthSq() > 0) {
          movement.normalize().multiplyScalar(7 * delta);
          camera.position.add(movement);
          camera.position.x = THREE.MathUtils.clamp(camera.position.x, -45, 45);
          camera.position.z = THREE.MathUtils.clamp(camera.position.z, -55, 55);
        }

        camera.position.y = 4.4 + Math.sin(time * 1.2) * 0.08;
      }

      for (const school of fishSchools) {
        const orbit = time * school.userData.speed + school.userData.offset;
        school.position.x += Math.cos(orbit) * 0.0025;
        school.position.z += Math.sin(orbit * 1.2) * 0.0025;
        school.rotation.y = Math.sin(orbit) * 0.75;

        school.children.forEach(fish => {
          fish.rotation.y = Math.sin(time * fish.userData.speed + fish.userData.offset) * 0.65;
          fish.position.y += Math.sin(time * 2 + fish.userData.offset) * 0.002;
        });
      }

      for (const group of seaweedGroups) {
        group.children.forEach(blade => {
          blade.rotation.z = Math.sin(time * 1.7 + blade.userData.phase) * 0.16;
        });
      }

      for (const bubble of bubbles) {
        bubble.position.y += bubble.userData.speed * delta;
        bubble.position.x += Math.sin(time + bubble.userData.drift) * 0.003;
        if (bubble.position.y > 19) {
          bubble.position.y = 0.2;
          bubble.position.x = (Math.random() - 0.5) * 70;
          bubble.position.z = (Math.random() - 0.5) * 90;
        }
      }

      treasure.rotation.y += delta * 0.08;
      depthLabel.textContent = `${(24 + Math.max(0, camera.position.z * -0.09)).toFixed(1)} m`;

      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate(performance.now());
  </script>
</body>
</html>
